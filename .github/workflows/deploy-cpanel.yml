name: Build and deploy web app to cPanel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-production-web
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out web app
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Store production build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PORT: ${{ vars.CPANEL_SSH_PORT || '21098' }}
      APP_ROOT: ${{ vars.CPANEL_APP_ROOT }}
      STAGE_NAME: .deploy-frontend-${{ github.sha }}
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@v4

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Validate deployment configuration
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$APP_ROOT"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy
          chmod 600 ~/.ssh/cpanel_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create remote staging directory
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
        run: |
          ssh -i ~/.ssh/cpanel_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$APP_ROOT' '$STAGE_NAME'" < .github/scripts/prepare-stage.sh

      - name: Upload frontend release
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/cpanel_deploy -p $SSH_PORT" \
            dist/ "$SSH_USER@$SSH_HOST:$APP_ROOT/$STAGE_NAME/"

      - name: Publish frontend release
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
        run: |
          ssh -i ~/.ssh/cpanel_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$APP_ROOT' '$STAGE_NAME'" < .github/scripts/deploy-cpanel.sh

      - name: Verify production health
        if: ${{ vars.PRODUCTION_URL != '' }}
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: curl --fail --show-error --silent --retry 5 --retry-delay 5 "$PRODUCTION_URL/api/health/"
